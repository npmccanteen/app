<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0d6efd" />
  <title>Medical Calculators - DocTools</title>
  <link rel="manifest" href="../manifest.json" />
  <link rel="icon" href="../icons/icon-192.png" />
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/tools.css" />
  <link rel="stylesheet" href="../css/calculators.css" />
</head>
<body>

  <header class="navbar">
    <div class="nav-inner">
      <a href="../index.html" class="brand">
        <span class="brand-icon">📄</span>
        <span class="brand-text">DocTools<small>by Munaf Wasif</small></span>
      </a>
      <nav class="nav-links">
        <a href="../index.html#tools">Tools</a>
        <a href="../login.html" class="btn-login">Login</a>
      </nav>
      <button class="menu-toggle" onclick="document.querySelector('.nav-links').classList.toggle('open')">☰</button>
    </div>
  </header>

  <main class="tool-page">
    <div class="tool-header">
      <span class="tool-icon-lg">🧮</span>
      <h1>Medical Calculators</h1>
      <p>MBBS স্টুডেন্টদের জন্য প্রয়োজনীয় সব ক্যালকুলেটর — এক জায়গায়।</p>
    </div>

    <!-- Search -->
    <div class="calc-search">
      <input type="text" id="calcSearch" placeholder="🔍 ক্যালকুলেটর খুঁজুন (BMI, GFR, GCS...)" />
    </div>

    <!-- Category Filter -->
    <div class="calc-categories" id="calcCategories">
      <button data-cat="all" class="active">সব</button>
      <button data-cat="general">General</button>
      <button data-cat="renal">Renal</button>
      <button data-cat="electrolyte">Electrolyte</button>
      <button data-cat="emergency">Emergency</button>
      <button data-cat="pediatric">Pediatric</button>
    </div>

    <!-- Calculator Grid -->
    <div class="calc-grid" id="calcGrid"></div>

    <!-- Calculator Modal / Panel -->
    <div class="calc-modal" id="calcModal">
      <div class="calc-modal-content">
        <button class="calc-close" id="calcClose">✕</button>
        <div id="calcContent"></div>
      </div>
    </div>

    <div class="info-note" style="margin-top:30px">
      ⚕️ <strong>Disclaimer:</strong> এই ক্যালকুলেটরগুলো শুধু educational purpose এর জন্য। Clinical decision এর জন্য অভিজ্ঞ ডাক্তারের পরামর্শ নিন।
    </div>
  </main>

  <footer class="footer">
    <p>© 2025 DocTools — Made with ❤️ by <strong>Munaf Wasif</strong></p>
  </footer>

  <script src="../js/calculators.js"></script>
</body>
</html>
